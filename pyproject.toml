[project]
name = "database-inspector"
version = "0.1.0"
description = "A CLI tool created to inspect databases and build Python models based on the schema."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Cory Coward", email = "corydottech@gmail.com"},
]
requires-python = ">=3.13,<4.0"
dependencies = [
    "astor>=0.8.1,<1.0.0",
    "inflect>=7.5.0,<8.0.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.1,<2.0.0",
    "ruff>=0.9.2,<1.0.0",
    "pylint>=3.3.3,<4.0.0",
]
test = [
    "pytest>=8.3.4,<9.0.0",
    "testcontainers[mssql,mysql,postgres]>=4.9.0,<5.0.0",
    "pytest-lazy-fixtures>=1.1.1,<2.0.0",
    "pytest-xdist>=3.6.1,<4.0.0",
]
postgres = [
    "psycopg[binary]>=3.2.4,<4.0.0",
]
mysql = [
    "mysql-connector-python>=9.1.0,<10.0.0",
]
mssql = [
    "pyodbc>=5.2.0,<6.0.0",
]

[tool.mypy]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["testcontainers.postgres.*", "testcontainers.mysql.*", "testcontainers.mssql.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
    ".", "src",
]
